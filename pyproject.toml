[project]
name = "aegis"
version = "0.1.0"
description = "Aegis — an action guardrail in front of a tool-calling agent for electric vehicles"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyahocorasick>=2.0",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["guardrail/tests", "agent/tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["guardrail", "agent/src", "agent", "."]
filterwarnings = ["ignore::DeprecationWarning"]
